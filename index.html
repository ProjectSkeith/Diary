<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diary">
<meta name="theme-color" content="#12051c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Diary</title>
<style>
:root{
  --pink:#ffb6e6; --lav:#c9a0ff; --ink:#12051c; --rad:47px;
  --panel:rgba(26,9,46,.80); --line:rgba(255,182,230,.28); --txt:#f3e9ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0314}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--txt);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;touch-action:manipulation}

/* ---------- the screen ---------- */
.app{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,calc(100dvh*390/844));height:100dvh;overflow:hidden;border-radius:var(--rad);
  background:var(--ink);isolation:isolate;--u:1px;--kb:0px;--io:.85;--dim:.15;--feather:14}
@media (max-width:500px){.app{left:0;top:0;transform:none;width:100%;height:100%;border-radius:0}}

.nebula{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(60% 40% at 25% 20%,rgba(255,120,200,.36),transparent 70%),
    radial-gradient(55% 45% at 80% 35%,rgba(150,90,255,.40),transparent 70%),
    radial-gradient(70% 50% at 40% 85%,rgba(200,70,160,.32),transparent 70%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0%,transparent 55%,rgba(0,0,0,.4) 100%);
  background-size:150% 150%;background-color:var(--bg,#2a0e4a);animation:neb 60s ease-in-out infinite alternate}
.app.noclouds .nebula{background-image:none;animation:none}
@keyframes neb{from{background-position:0% 0%}to{background-position:100% 100%}}
.flow{position:absolute;inset:-12%;z-index:1;pointer-events:none;
  background:radial-gradient(closest-side,transparent 52%,rgba(255,140,220,.26) 84%,rgba(201,160,255,.34) 100%);
  animation:flow 11s ease-in-out infinite}
@keyframes flow{0%{transform:scale(1.16);opacity:0}35%{opacity:1}100%{transform:scale(.93);opacity:0}}
.app.noflow .flow{display:none}
@media (prefers-reduced-motion:reduce){.nebula,.flow{animation:none}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:1}
#fx{z-index:3}

/* ---------- collage grid ---------- */
.grid{position:absolute;inset:0;z-index:2;pointer-events:none}
.app.collage .grid{pointer-events:auto}
.tile{position:absolute;overflow:hidden}
.app.collage .tile{touch-action:none}
.tile .im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:var(--io);
  transform-origin:50% 50%;pointer-events:none;-webkit-user-drag:none}
.tile.has::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:rgba(14,4,28,var(--dim))}
.tile.has::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 calc(var(--feather)*1px) calc(var(--feather)*.35px) rgba(18,5,32,.95)}
.tile .ring{position:absolute;inset:3px;z-index:5;border-radius:10px;pointer-events:none;display:none;
  border:1px dashed rgba(255,182,230,.5)}
.app.collage .tile .ring{display:block}
.app.collage .tile.sel .ring{border:2px solid var(--pink);box-shadow:0 0 14px rgba(255,182,230,.6),inset 0 0 14px rgba(255,182,230,.25)}
.app.collage .tile:not(.has)::after{content:"＋";position:absolute;inset:0;z-index:2;display:grid;place-items:center;
  font-size:28px;color:rgba(255,182,230,.65);pointer-events:none}

/* ---------- freeform text ---------- */
.texts{position:absolute;inset:0;z-index:4;pointer-events:none}
.app.collage .texts{opacity:.45;pointer-events:none}
.app.collage .block{pointer-events:none}
.block{position:absolute;pointer-events:auto;touch-action:none}
.block.editing{touch-action:auto}
.txt{outline:none;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.3em;
  padding:calc(6*var(--u)) calc(8*var(--u));border-radius:calc(10*var(--u));caret-color:var(--pink);
  -webkit-user-select:none;user-select:none}
.txt:empty::before{content:attr(data-ph);opacity:.4}
.block.editing .txt{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.block.sel .txt{box-shadow:0 0 0 1px rgba(255,182,230,.55);background:rgba(20,6,38,.18)}
.block.glow .txt{text-shadow:0 0 calc(2*var(--u)) var(--gc),0 0 calc(8*var(--u)) var(--gg),0 0 calc(18*var(--u)) var(--gg)}
.hd{position:absolute;display:none;width:34px;height:34px;border-radius:50%;place-items:center;z-index:3;
  background:rgba(40,14,66,.92);border:1px solid var(--pink);color:#fff;font-size:16px;line-height:1}
.block.sel .hd{display:grid}
.h-move{left:-17px;top:-17px}.h-del{right:-17px;top:-17px}.h-size{right:-17px;bottom:-17px}

/* ---------- frame ---------- */
.frame{position:absolute;inset:0;z-index:40;border-radius:var(--rad);pointer-events:none;padding:4px;
  background:linear-gradient(135deg,#ffb6e6,#c9a0ff 50%,#ffb6e6);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  filter:drop-shadow(0 0 5px rgba(255,182,230,.8))}
.frame-glow{position:absolute;inset:0;z-index:39;border-radius:var(--rad);pointer-events:none;
  box-shadow:inset 0 0 34px 6px rgba(255,150,225,.34),inset 0 0 90px rgba(201,160,255,.16)}

/* ---------- dock + sheets ---------- */
.dock{position:absolute;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:2px;padding:5px;
  bottom:calc(var(--kb) + max(env(safe-area-inset-bottom),12px) + 4px);
  border-radius:28px;background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 0 22px rgba(201,160,255,.22)}
.dock button{min-width:46px;height:42px;padding:0 8px;border-radius:21px;font-size:18px;white-space:nowrap}
.dock button.on{background:rgba(255,182,230,.22);box-shadow:inset 0 0 0 1px var(--line)}
.dock [data-act=done]{display:none;color:var(--pink)}
.dock.editing [data-act=done]{display:block}
.fab{position:absolute;left:50%;transform:translateX(-50%);z-index:50;width:38px;height:38px;border-radius:50%;
  bottom:calc(var(--kb) + max(env(safe-area-inset-bottom),12px) + 4px);font-size:16px;
  background:var(--panel);border:1px solid var(--line);opacity:.65}

.sheet{position:absolute;left:10px;right:10px;z-index:45;max-height:52%;overflow:auto;scrollbar-width:thin;scrollbar-color:#c9a0ff rgba(255,255,255,.1);
  bottom:calc(var(--kb) + max(env(safe-area-inset-bottom),12px) + 62px);
  padding:6px 14px 14px;border-radius:24px;background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 0 26px rgba(201,160,255,.22)}
.sheet.min .pane{display:none}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,182,230,.4);margin:2px auto 8px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.lbl{width:56px;font-size:12px;opacity:.7;flex:none}
.row output{width:30px;font-size:12px;opacity:.7;text-align:right;flex:none}
input[type=range]{flex:1;min-width:0;accent-color:var(--pink);height:28px}
.chips,.tabs{flex-wrap:wrap;gap:6px}
.chip,.tab,.kb,.btn{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:14px;color:#fff}
.chip{padding:8px 12px;font-size:16px}
.chip.on,.tab.on,.btn.on{background:rgba(255,182,230,.28);border-color:var(--pink)}
.swatches{flex-wrap:wrap;gap:8px}
.sw-c{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex:none}
.sw-c.on{border-color:var(--pink);box-shadow:0 0 8px var(--pink)}
input[type=color]{width:56px;height:36px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px;flex:none}
.btn{padding:9px 13px;font-size:14px}
.btn[disabled]{opacity:.3}
.seg{gap:6px;flex-wrap:wrap}
.seg .btn{min-width:44px;display:grid;place-items:center}
.sw{display:flex;align-items:center;gap:8px;font-size:14px}
.sw input{display:none}
.sw i{width:40px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:#d58bff}
.sw input:checked+i::after{left:19px}
.tabs{display:flex;margin-bottom:8px}
.tab{padding:7px 11px;font-size:14px}
.kgrid{display:flex;flex-wrap:wrap;gap:6px}
.kb{padding:9px 11px;font-size:16px;min-height:40px}
.kgrid.kana .kb{min-width:44px;font-size:20px;padding:6px 4px}
.hint{font-size:12px;opacity:.6;margin:4px 0}
.grid4{display:grid;grid-template-columns:70px repeat(4,1fr);gap:6px;align-items:center;margin:6px 0}
.grid4 small{font-size:11px;opacity:.65}
.grid4 .head{text-align:center}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 18px);transform:translate(-50%,-10px);z-index:60;
  max-width:84%;padding:10px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);
  font-size:13px;text-align:center;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="nebula"></div>
  <div class="flow"></div>
  <canvas id="stars"></canvas>
  <div class="grid" id="grid"></div>
  <canvas id="fx"></canvas>
  <div class="texts" id="texts"></div>
  <div class="frame-glow"></div>
  <div class="frame"></div>

  <!-- panels -->
  <div class="sheet" id="sheet" hidden>
    <div class="grab" id="grab"></div>

    <div class="pane" id="p-text" hidden>
      <div class="row chips" id="fontChips"></div>
      <div class="row"><span class="lbl">size</span><input type="range" id="tSize" min="10" max="96"><output id="tSizeV"></output></div>
      <div class="row"><span class="lbl">color</span><input type="color" id="tColor"><span class="lbl" style="margin-left:6px;width:auto">glow</span><input type="color" id="tGc"></div>
      <div class="row seg">
        <button class="btn" data-al="left"  aria-label="align left"><svg width="18" height="14" viewBox="0 0 18 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 2h16M1 7h10M1 12h14"/></svg></button>
        <button class="btn" data-al="center" aria-label="align center"><svg width="18" height="14" viewBox="0 0 18 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 2h16M4 7h10M2 12h14"/></svg></button>
        <button class="btn" data-al="right" aria-label="align right"><svg width="18" height="14" viewBox="0 0 18 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 2h16M7 7h10M3 12h14"/></svg></button>
        <label class="sw" style="margin-left:6px"><input type="checkbox" id="tGlow"><i></i><span>glow</span></label>
        <button class="btn" id="tDel" style="margin-left:auto">delete</button>
      </div>
      <div class="row"><span class="lbl">letters</span><input type="range" id="tLs" min="-5" max="40"><output id="tLsV"></output></div>
      <div class="row"><span class="lbl">lines</span><input type="range" id="tLh" min="90" max="260"><output id="tLhV"></output></div>
      <div class="row"><span class="lbl">fade</span><input type="range" id="tOp" min="20" max="100"><output id="tOpV"></output></div>
    </div>

    <div class="pane" id="p-kao" hidden>
      <div class="row tabs" id="kTabs"></div>
      <div class="kgrid" id="kGrid"></div>
    </div>

    <div class="pane" id="p-collage" hidden>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn" id="cPick">choose photo</button>
        <button class="btn" id="cClear">remove photo</button>
        <button class="btn" id="cFit">mode: fill slot</button>
      </div>
      <div class="row"><span class="lbl">zoom</span><input type="range" id="cZoom" min="100" max="300"><output id="cZoomV"></output></div>
      <div class="hint">Tap a slot to select it. Drag a photo to reposition it. Tap an empty selected slot to add a photo.</div>
      <div class="grid4">
        <small></small><small class="head">left</small><small class="head">top</small><small class="head">bottom</small><small class="head">right</small>
        <small>stretch edge</small>
        <button class="btn" data-g="l">◀</button><button class="btn" data-g="t">▲</button><button class="btn" data-g="b">▼</button><button class="btn" data-g="r">▶</button>
        <small>pull edge in</small>
        <button class="btn" data-p="l">▶</button><button class="btn" data-p="t">▼</button><button class="btn" data-p="b">▲</button><button class="btn" data-p="r">◀</button>
      </div>
      <div class="row">
        <button class="btn" id="cFull">all 6 = one image</button>
        <button class="btn" id="cReset">back to 6 slots</button>
      </div>
      <div class="row"><span class="lbl">backdrop</span><input type="color" id="sBg"><label class="sw" style="margin-left:8px"><input type="checkbox" id="sClouds"><i></i><span>nebula clouds</span></label></div>
      <div class="row"><span class="lbl">soften</span><input type="range" id="sIo" min="25" max="100"></div>
      <div class="row"><span class="lbl">darken</span><input type="range" id="sDim" min="0" max="75"></div>
      <div class="row"><span class="lbl">edges</span><input type="range" id="sFeather" min="0" max="50"></div>
    </div>

    <div class="pane" id="p-fx" hidden>
      <div class="row"><label class="sw"><input type="checkbox" id="fStars"><i></i><span>floating stars</span></label></div>
      <div class="row"><label class="sw"><input type="checkbox" id="fFlow"><i></i><span>inward glow</span></label></div>
      <div class="row"><label class="sw"><input type="checkbox" id="fSpark"><i></i><span>sparkles</span></label></div>
      <div class="row"><label class="sw"><input type="checkbox" id="fFlare"><i></i><span>soft light flares</span></label></div>
      <div class="row"><label class="sw"><input type="checkbox" id="fRainbow"><i></i><span>rainbow glare</span></label></div>
      <div class="row"><label class="sw"><input type="checkbox" id="fSnow"><i></i><span>colorful snow</span></label></div>
      <div class="row"><label class="sw"><input type="checkbox" id="fBunny"><i></i><span>tiny bunnies raining</span></label></div>
      <div class="row"><label class="sw"><input type="checkbox" id="fSilly"><i></i><span>silly rain</span></label></div>
      <div class="row"><span class="lbl">amount</span><input type="range" id="fAmt" min="10" max="100"></div>
    </div>
  </div>

  <nav class="dock" id="dock">
    <button data-act="collage" aria-label="collage">▦</button>
    <button data-act="new" aria-label="new text">✎</button>
    <button data-act="text" aria-label="text style">Aa</button>
    <button data-act="kao" aria-label="kaomoji">◕‿◕</button>
    <button data-act="fx" aria-label="effects">✧</button>
    <button data-act="done" aria-label="done">✓</button>
    <button data-act="hide" aria-label="hide menu">⌄</button>
  </nav>
  <button class="fab" id="fab" hidden aria-label="show menu">✦</button>
  <div class="toast" id="toast"></div>
  <input type="file" id="file" accept="image/*" multiple hidden>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const COLS = 2, ROWS = 3;
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const KEY = 'diary.v1';
const W = () => app.clientWidth, H = () => app.clientHeight;

/* =================== state =================== */
const DEF = { io: .85, dim: .15, feather: 14, stars: true, flow: true, spark: false, flare: false, rainbow: false, snow: false, bunny: false, silly: false, fxi: .5, bg: '#2a0e4a', clouds: true };
const newTile = (c, r) => ({ id: uid(), c, r, w: 1, h: 1, img: null, fit: false, z: 1, tx: 0, ty: 0 });
const defaultTiles = () => { const a = []; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) a.push(newTile(c, r)); return a; };
function load() {
  try {
    const j = JSON.parse(localStorage.getItem(KEY));
    if (j && Array.isArray(j.tiles) && Array.isArray(j.texts)) { j.set = { ...DEF, ...j.set }; return j; }
  } catch (e) {}
  return {
    tiles: defaultTiles(),
    texts: [{ id: uid(), x: .14, y: .44, w: .72, text: 'begin anywhere.', font: 0, size: 22, color: '#f3e9ff', align: 'center', glow: false, ls: 6, lh: 140, op: .9 }],
    set: { ...DEF }
  };
}
let S = load();
// older saves used a 3x2 grid: move their photos into the new 2x3 grid
if (S.grid !== '2x3') {
  const imgs = S.tiles.filter(t => t.img);
  S.tiles = defaultTiles();
  imgs.forEach((o, i) => { if (S.tiles[i]) { S.tiles[i].img = o.img; S.tiles[i].fit = o.fit; } });
  S.grid = '2x3';
}
let saveT;
const flush = () => { clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const save = () => { clearTimeout(saveT); saveT = setTimeout(flush, 250); };
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* =================== image storage (IndexedDB) =================== */
const idb = new Promise((res, rej) => {
  try {
    const q = indexedDB.open('diary', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('imgs');
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  } catch (e) { rej(e); }
});
const tx = (mode, fn) => idb.then(db => new Promise((res, rej) => {
  const t = db.transaction('imgs', mode); const r = fn(t.objectStore('imgs'));
  t.oncomplete = () => res(r.result); t.onerror = () => rej(t.error);
}));
const putImg = (id, b) => tx('readwrite', s => s.put(b, id));
const getImg = id => tx('readonly', s => s.get(id));
const delImg = id => tx('readwrite', s => s.delete(id));
const allKeys = () => tx('readonly', s => s.getAllKeys());
const urls = {};
const mem = {}; // fallback if IndexedDB is unavailable
async function urlFor(id) {
  if (urls[id]) return urls[id];
  let b = mem[id];
  if (!b) { try { b = await getImg(id); } catch (e) {} }
  return b ? (urls[id] = URL.createObjectURL(b)) : null;
}
function gcImages() {
  const used = new Set(S.tiles.map(t => t.img).filter(Boolean));
  allKeys().then(keys => keys.forEach(k => { if (!used.has(k)) { delImg(k); if (urls[k]) { URL.revokeObjectURL(urls[k]); delete urls[k]; } } })).catch(() => {});
}
async function prepImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = new Image(); im.src = url; await im.decode();
    const max = 1600, s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const png = file.type === 'image/png';
    return await new Promise(r => c.toBlob(r, png ? 'image/png' : 'image/jpeg', .88));
  } finally { URL.revokeObjectURL(url); }
}

/* =================== toast =================== */
const toastEl = $('#toast'); let toastT;
function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2600); }

/* =================== sizing, keyboard =================== */
function setU() { app.style.setProperty('--u', (W() / 390) + 'px'); }
new ResizeObserver(() => { setU(); sizeCanvas(); }).observe(app);
function kb() {
  const v = window.visualViewport; if (!v) return;
  app.style.setProperty('--kb', Math.max(0, innerHeight - v.height - v.offsetTop) + 'px');
}
if (window.visualViewport) { visualViewport.addEventListener('resize', kb); visualViewport.addEventListener('scroll', kb); }

/* =================== settings =================== */
function applySettings() {
  const s = S.set;
  app.style.setProperty('--io', s.io); app.style.setProperty('--dim', s.dim); app.style.setProperty('--feather', s.feather);
  app.classList.toggle('noflow', !s.flow);
  app.style.setProperty('--bg', s.bg); app.classList.toggle('noclouds', !s.clouds);
}

/* =================== panes / dock =================== */
const sheet = $('#sheet'), dock = $('#dock'), fab = $('#fab');
let pane = null;
function openPane(name, force) {
  if (pane === name && !force) { closePane(); return; }
  if (name === 'collage' && selected) deselect();
  pane = name;
  $$('.pane').forEach(p => p.hidden = p.id !== 'p-' + name);
  sheet.hidden = false; sheet.classList.remove('min');
  app.classList.toggle('collage', name === 'collage');
  if (document.activeElement && document.activeElement.blur && document.activeElement !== document.body) document.activeElement.blur();

  symbols: [...'☾ ☽ ✦ ✧ ✶ ✷ ⋆ ˚ ⁂ ※ ☉ ☿ ♀ ♁ ♂ ♃ ♄ ♅ ♆ ♇ ♈ ♉ ♊ ♋ ♌ ♍ ♎ ♏ ♐ ♑ ♒ ♓ ⚹ ⛧ ☥ ☯ ☸ ⚚ ✠ ✡ ∞ ⸸ ᛉ ᚨ ᛟ ᛞ ᚱ ᛗ ⟡ ◈ ❖ ⌖ ⊹ ✺ ❍ ◯ △ ▽ ◇ ⌬ ⍟ ⏣ ☍ ☌ ☊ ☋ ⚷ ⚳ † ‡ § ¶ ✂ ☙ ❧ ⁑ ◌ ⊙ ☁ ☂ ☄ ⚡'.split(' ')].map(vs),
  'あ': hira, 'ア': kata,
  'àè': [...'à è é ì ò ù À È É Ì Ò Ù ç « » “ ” ‘ ’ — – … ° ‹ › ·'.split(' ')]
};
const KTABS = [['recent', '🕘'], ['quiet', 'quiet'], ['heavy', 'heavy'], ['uneasy', 'uneasy'], ['dream', 'dream'], ['tender', 'tender'], ['anger', 'anger'], ['animals', 'animals'], ['gesture', 'gesture'], ['symbols', '☾ symbols'], ['あ', 'あ'], ['ア', 'ア'], ['àè', 'àè IT']];
let ktab = 'quiet';
let recent = []; try { recent = JSON.parse(localStorage.getItem('diary.recent')) || []; } catch (e) {}
function renderKao() {
  const tabs = $('#kTabs'); tabs.replaceChildren();
  KTABS.forEach(([k, label]) => {
    const b = document.createElement('button'); b.className = 'tab' + (k === ktab ? ' on' : ''); b.textContent = label;
    b.onclick = () => { ktab = k; renderKao(); }; tabs.appendChild(b);
  });
  const g = $('#kGrid'); g.replaceChildren();
  const list = ktab === 'recent' ? recent : KAO[ktab];
  g.classList.toggle('kana', ktab === 'あ' || ktab === 'ア' || ktab === 'àè' || ktab === 'symbols');
  if (!list.length) { g.innerHTML = '<div class="hint">nothing yet. Things you insert will appear here.</div>'; return; }
  list.forEach(s => { const b = document.createElement('button'); b.className = 'kb'; b.textContent = s; b.onclick = () => insertText(s); g.appendChild(b); });
}
let lastRange = null;
document.addEventListener('selectionchange', () => {
  const s = getSelection(); if (!s || !s.rangeCount) return;
  const r = s.getRangeAt(0);
  const n = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
  const t = n && n.closest && n.closest('.txt');
  if (t && t.isContentEditable) lastRange = r.cloneRange();
});
function insertText(s) {
  recent = [s, ...recent.filter(x => x !== s)].slice(0, 24);
  try { localStorage.setItem('diary.recent', JSON.stringify(recent)); } catch (e) {}
  let b = selected;
  if (!b) { b = addText(.15, .35 + Math.random() * .2); if (pane !== 'kao') openPane('kao', true); }
  const el = els.get(b.id), t = $('.txt', el);
  let r;
  if (lastRange && t.contains(lastRange.startContainer)) r = lastRange;
  else { r = document.createRange(); r.selectNodeContents(t); r.collapse(false); }
  r.deleteContents();
  const n = document.createTextNode(s); r.insertNode(n); r.setStartAfter(n); r.collapse(true); lastRange = r;
  if (document.activeElement === t) { const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  b.text = t.innerText; save();
}

/* =================== effects =================== */
const fxPane = { stars: '#fStars', flow: '#fFlow', spark: '#fSpark', flare: '#fFlare', rainbow: '#fRainbow', snow: '#fSnow', bunny: '#fBunny', silly: '#fSilly' };
Object.entries(fxPane).forEach(([k, sel]) => $(sel).onchange = e => { S.set[k] = e.target.checked; applySettings(); save(); });
$('#fAmt').oninput = e => { S.set.fxi = e.target.value / 100; save(); };
function syncFx() { Object.entries(fxPane).forEach(([k, sel]) => $(sel).checked = !!S.set[k]); $('#fAmt').value = S.set.fxi * 100; }

const cs = $('#stars'), cf = $('#fx'), sx = cs.getContext('2d'), fxx = cf.getContext('2d');
let dpr = Math.min(2, devicePixelRatio || 1), CW = 0, CH = 0, stars = [], sparks = [], flares = [], fall = [];
const SILLY = ['🍓', '🌸', '🐸', '🍄', '🎀', '🍡', '🦆', '🧁', '⭐', '🫧', '🐱', '🌈', '🍩', '🪩', '🐥', '🍒'];
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function sizeCanvas() {
  CW = W(); CH = H(); if (!CW) return;
  for (const c of [cs, cf]) { c.width = Math.round(CW * dpr); c.height = Math.round(CH * dpr); }
  sx.setTransform(dpr, 0, 0, dpr, 0, 0); fxx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(CW * CH / 4500), cols = ['#ffffff', '#ffd6ff', '#e0b0ff', '#cfe0ff'];
  stars = Array.from({ length: n }, () => ({ x: Math.random() * CW, y: Math.random() * CH, r: Math.random() * 1.2 + .3, p: Math.random() * 6.28, s: Math.random() * .8 + .3, v: Math.random() * 4 + 1, c: cols[Math.random() * 4 | 0] }));
  flares = Array.from({ length: 4 }, (_, i) => ({ x: Math.random() * CW, y: Math.random() * CH, vx: (Math.random() - .5) * 8, vy: (Math.random() - .5) * 8, r: (90 + Math.random() * 90), p: Math.random() * 6, col: [[255, 140, 210], [170, 130, 255], [255, 190, 170], [140, 200, 255]][i] }));
}
function star4(c, x, y, r) {
  c.beginPath(); c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r);
  c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r); c.fill();
}
function spawnFall(kind) {
  const x = Math.random() * CW;
  const p = { kind, x0: x, x, y: -30, ph: Math.random() * 6.28, sw: 8 + Math.random() * 22 };
  if (kind === 'snow') { p.r = 2 + Math.random() * 4.5; p.h = Math.random() * 360; p.vy = 25 + Math.random() * 45; }
  else { p.size = (kind === 'bunny' ? 15 : 17) + Math.random() * 15; p.ch = kind === 'bunny' ? '🐰' : SILLY[Math.random() * SILLY.length | 0]; p.vy = 40 + Math.random() * 60; }
  fall.push(p);
}
let lastF = 0, wasStars = true, wasFx = true;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden || now - lastF < 33 || !CW) return;
  const dt = Math.min(.1, (now - lastF) / 1000); lastF = now; const t = now / 1000, s = S.set, amt = s.fxi;
  // stars
  if (s.stars) {
    sx.clearRect(0, 0, CW, CH);
    for (const st of stars) {
      st.y -= st.v * dt; if (st.y < -2) { st.y = CH + 2; st.x = Math.random() * CW; }
      sx.globalAlpha = .25 + .6 * (.5 + .5 * Math.sin(t * st.s + st.p));
      sx.fillStyle = st.c; sx.beginPath(); sx.arc(st.x, st.y, st.r, 0, 6.283); sx.fill();
    }
    sx.globalAlpha = 1; wasStars = true;
  } else if (wasStars) { sx.clearRect(0, 0, CW, CH); wasStars = false; }

  const on = s.spark || s.flare || s.rainbow || s.snow || s.bunny || s.silly;
  if (!on) { if (wasFx) { fxx.clearRect(0, 0, CW, CH); wasFx = false; sparks = []; fall = []; } return; }
  fxx.clearRect(0, 0, CW, CH); wasFx = true;

  // soft light flares + rainbow glare (additive light)
  fxx.globalCompositeOperation = 'lighter';
  if (s.flare) {
    for (const f of flares) {
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < -f.r) f.x = CW + f.r; if (f.x > CW + f.r) f.x = -f.r; if (f.y < -f.r) f.y = CH + f.r; if (f.y > CH + f.r) f.y = -f.r;
      const a = (.05 + .07 * (.5 + .5 * Math.sin(t * .4 + f.p))) * (.4 + amt * 1.2), [r, g, b] = f.col;
      const gr = fxx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      gr.addColorStop(0, `rgba(${r},${g},${b},${a})`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
      fxx.fillStyle = gr; fxx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    }
  }
  if (s.rainbow) {
    // a wide diagonal rainbow band that sweeps across the screen and breathes
    const bw = CW * 1.1, k = (t * .06) % 1.5 - .25, ax = -bw + k * (CW + bw * 2);
    const a = (.12 + .30 * amt) * (.65 + .35 * Math.sin(t * 1.1));
    const g = fxx.createLinearGradient(ax, 0, ax + bw, bw * .55);
    const stops = [[0, 'rgba(255,60,60,0)'], [.14, `rgba(255,70,90,${a})`], [.28, `rgba(255,190,60,${a})`], [.42, `rgba(255,255,110,${a})`], [.56, `rgba(90,255,150,${a})`], [.7, `rgba(80,200,255,${a})`], [.84, `rgba(150,110,255,${a})`], [1, 'rgba(255,110,230,0)']];
    stops.forEach(([o, c]) => g.addColorStop(o, c));
    fxx.fillStyle = g; fxx.fillRect(0, 0, CW, CH);
  }
  fxx.globalCompositeOperation = 'source-over';

  // falling things: snow, bunnies, silly emoji
  const want = { snow: s.snow ? 25 + Math.round(90 * amt) : 0, bunny: s.bunny ? 5 + Math.round(24 * amt) : 0, silly: s.silly ? 5 + Math.round(24 * amt) : 0 };
  const have = { snow: 0, bunny: 0, silly: 0 };
  fall = fall.filter(p => want[p.kind] > 0 && p.y < CH + 40);
  for (const p of fall) have[p.kind]++;
  for (const k of ['snow', 'bunny', 'silly']) if (have[k] < want[k] && Math.random() < .4) spawnFall(k);
  fxx.textAlign = 'center'; fxx.textBaseline = 'middle';
  for (const p of fall) {
    p.y += p.vy * dt; p.x = p.x0 + Math.sin(t * .9 + p.ph) * p.sw;
    if (p.kind === 'snow') {
      fxx.fillStyle = `hsla(${(p.h + t * 25) % 360},95%,78%,.92)`; fxx.shadowColor = fxx.fillStyle; fxx.shadowBlur = 6;
      fxx.beginPath(); fxx.arc(p.x, p.y, p.r, 0, 6.283); fxx.fill(); fxx.shadowBlur = 0;
    } else {
      fxx.save(); fxx.translate(p.x, p.y); fxx.rotate(Math.sin(t * 1.3 + p.ph) * .45);
      fxx.font = `${p.size}px ${EMOJI_FONT}`; fxx.fillText(p.ch, 0, 0); fxx.restore();
    }
  }

  // sparkles: big, bright, mixed colours
  if (s.spark) {
    const max = 8 + Math.round(40 * amt);
    if (sparks.length < max && Math.random() < .35) {
      const rainbow = Math.random() < .55;
      sparks.push({ x: Math.random() * CW, y: Math.random() * CH, age: 0, life: 1.2 + Math.random() * 1.8, r: (9 + Math.random() * 24) * (.6 + amt * .9), c: rainbow ? `hsl(${Math.random() * 360 | 0},100%,80%)` : ['#ffffff', '#ffd6ff', '#ffe9a8'][Math.random() * 3 | 0] });
    }
    fxx.shadowBlur = 16;
    sparks = sparks.filter(p => (p.age += dt) < p.life);
    for (const p of sparks) {
      const k = p.age / p.life, e = Math.sin(k * Math.PI); fxx.globalAlpha = Math.min(1, e * 1.25); fxx.fillStyle = p.c; fxx.shadowColor = p.c;
      star4(fxx, p.x, p.y, p.r * (.45 + e * .75));
      fxx.globalAlpha = Math.min(1, e); star4(fxx, p.x, p.y, p.r * .35 * (.5 + e)); // bright core
    }
    fxx.shadowBlur = 0; fxx.globalAlpha = 1;
  } else sparks = [];
}

/* =================== boot =================== */
setU(); kb(); applySettings(); sizeCanvas();
S.texts.forEach(mkBlock);
renderGrid();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
if (/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone && !localStorage.getItem('diary.hint')) {
  try { localStorage.setItem('diary.hint', '1'); } catch (e) {}
  setTimeout(() => toast('Share ⎋ then “Add to Home Screen” for the full-screen diary'), 800);
}
})();
</script>
